<!DOCTYPE html>

  <meta charset="UTF-8">
  <title>Soccer Stadium VR</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

<script>
  AFRAME.registerComponent('player-collision', {
    schema: {
      radius: {default: 0.5}
    },

    init: function () {
      this.previousPosition = new THREE.Vector3();
      this.el.object3D.getWorldPosition(this.previousPosition);
    },

    tick: function () {
      const player = this.el.object3D;
      const current = new THREE.Vector3();

      player.getWorldPosition(current);

      const barriers = document.querySelectorAll('.collidable');
      let blocked = false;

      barriers.forEach(barrier => {
        const box = new THREE.Box3().setFromObject(barrier.object3D);

        // Expand collision area for player width
        box.expandByScalar(this.data.radius);

        if (
          current.x >= box.min.x &&
          current.x <= box.max.x &&
          current.z >= box.min.z &&
          current.z <= box.max.z &&
          current.y >= box.min.y &&
          current.y <= box.max.y
        ) {
          blocked = true;
        }
      });

      if (blocked) {
        player.position.copy(this.previousPosition);
      } else {
        this.previousPosition.copy(current);
      }
    }
  });
</script>
